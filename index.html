<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anuj Gour Website</title>
<style>
body{background:black; color:white; font-family:Arial; margin:0; padding:20px;}
.box{background:white; color:black; padding:20px; border-radius:15px; max-width:350px; margin:50px auto; text-align:center;}
input{width:90%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:8px;}
button{width:95%; padding:12px; background:#0055ff; color:white; border:none; border-radius:8px; font-size:16px;}
a{color:#0055ff; display:block; margin-top:10px; cursor:pointer; text-decoration:none;}
#msg{color:red; margin-top:10px;}
</style>
</head>
<body>

<div id="loginBox" class="box">
  <h2>Login Karo 👋</h2>
  <p>Anuj Gour Website me Entry ke liye</p>
  <input id="loginNumber" placeholder="Mobile Number (ID)" type="number">
  <input id="loginPass" placeholder="Password" type="password">
  <button onclick="login()">LOGIN</button>
  <a onclick="showBox('signupBox')">Naya ho? Signup Karo</a>
  <p id="msg"></p>
  <hr>
  <p style="font-size:13px; color:grey;">Test ke liye - ID: 9999999999 <br> Password: 1234</p>
</div>

<div id="signupBox" class="box" style="display:none;">
  <h2>Signup Karo</h2>
  <input id="signName" placeholder="Apna Naam">
  <input id="signNumber" placeholder="Mobile Number" type="number">
  <input id="signPass" placeholder="Password Banao" type="password">
  <button onclick="signup()">SIGNUP</button>
  <a onclick="showBox('loginBox')">Pehle se account hai? Login Karo</a>
  <p id="msg2"></p>
</div>

<div id="homeBox" class="box" style="display:none;">
  <h2 id="welcomeText">Namaste 🙏</h2>
  <p>Login ho gaya! Ab tum andar ho.</p>
  <button onclick="logout()" style="background:red;">LOGOUT</button>
</div>

<script>
function getUsers(){ return JSON.parse(localStorage.getItem('anuj_users') || '{}'); }
function saveUsers(u){ localStorage.setItem('anuj_users', JSON.stringify(u)); }

function showBox(id){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('signupBox').style.display='none';
  document.getElementById('homeBox').style.display='none';
  document.getElementById(id).style.display='block';
}

function signup(){
  let name=document.getElementById('signName').value.trim();
  let num=document.getElementById('signNumber').value.trim();
  let pass=document.getElementById('signPass').value;
  if(!name || !num || !pass){ document.getElementById('msg2').innerText="Sab bharo bhai!"; return; }
  let users=getUsers();
  users[num]={name:name, pass:pass};
  saveUsers(users);
  alert("Signup ho gaya! Ab isi ID-Password se Login karo");
  showBox('loginBox');
  document.getElementById('loginNumber').value=num;
}

function login(){
  let num=document.getElementById('loginNumber').value.trim();
  let pass=document.getElementById('loginPass').value;
  let users=getUsers();

  // TEST LOGIN - hamesha chalega
  if(num=="9999999999" && pass=="1234"){
    localStorage.setItem('anuj_login', num);
    document.getElementById('welcomeText').innerText="Namaste Test User 🙏";
    showBox('homeBox');
    return;
  }

  if(users[num] && users[num].pass===pass){
    localStorage.setItem('anuj_login', num);
    document.getElementById('welcomeText').innerText="Namaste "+users[num].name+" 🙏";
    showBox('homeBox');
  } else {
    document.getElementById('msg').innerText="Galat ID ya Password! Pehle Signup karo.";
  }
}

function logout(){
  localStorage.removeItem('anuj_login');
  showBox('loginBox');
}

window.onload=function(){
  let logged=localStorage.getItem('anuj_login');
  let users=getUsers();
  if(logged && (users[logged] || logged=="9999999999")){
    let nm = logged=="9999999999" ? "Test User" : users[logged].name;
    document.getElementById('welcomeText').innerText="Namaste "+nm+" 🙏";
    showBox('homeBox');
  }
}
</script>
</body>
</html>
